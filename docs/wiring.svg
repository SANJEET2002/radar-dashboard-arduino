<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" role="img" aria-labelledby="wireTitle wireDesc">
  <title id="wireTitle">ESP32 Smart Radar connection diagram</title>
  <desc id="wireDesc">GPIO 14 triggers the HC-SR04, GPIO 26 reads echo through a 1 kilohm and 2 kilohm divider, GPIO 13 drives the servo, and GPIO 33 drives the buzzer. 5 V and ground are shared. A separate 5 V supply is recommended for the servo.</desc>
  <rect width="1120" height="780" rx="16" fill="#F4F7F6"/>

  <!-- Power rails (drawn first so signal taps sit on top) -->
  <line x1="990" y1="118" x2="990" y2="520" stroke="#E53935" stroke-width="3"/>
  <line x1="1060" y1="168" x2="1060" y2="692" stroke="#263238" stroke-width="3"/>
  <text x="990" y="108" text-anchor="middle" fill="#C62828" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">5V</text>
  <text x="1060" y="108" text-anchor="middle" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">GND</text>

  <!-- ESP32 -->
  <rect x="24" y="36" width="230" height="674" rx="16" fill="#102028"/>
  <text x="40" y="68" fill="#B8F5D0" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ESP32</text>
  <text x="40" y="90" fill="#8AA0A6" font-family="Arial, Helvetica, sans-serif" font-size="12">pins used by this sketch</text>

  <!-- 5V -->
  <text x="44" y="124" fill="#FFCDD2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">5V</text>
  <circle cx="254" cy="120" r="7" fill="#E53935" stroke="#FFFFFF" stroke-width="2"/>
  <!-- GND -->
  <text x="44" y="174" fill="#ECEFF1" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">GND</text>
  <circle cx="254" cy="170" r="7" fill="#263238" stroke="#FFFFFF" stroke-width="2"/>
  <!-- GPIO 14 -->
  <text x="44" y="294" fill="#E3F2FD" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">GPIO 14</text>
  <text x="130" y="294" fill="#90CAF9" font-family="Arial, Helvetica, sans-serif" font-size="13">TRIG</text>
  <circle cx="254" cy="290" r="7" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2"/>
  <!-- GPIO 26 -->
  <text x="44" y="364" fill="#E8F5E9" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">GPIO 26</text>
  <text x="130" y="364" fill="#A5D6A7" font-family="Arial, Helvetica, sans-serif" font-size="13">ECHO</text>
  <circle cx="254" cy="360" r="7" fill="#43A047" stroke="#FFFFFF" stroke-width="2"/>
  <!-- GPIO 13 -->
  <text x="44" y="524" fill="#FFF3E0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">GPIO 13</text>
  <text x="130" y="524" fill="#FFCC80" font-family="Arial, Helvetica, sans-serif" font-size="13">SERVO</text>
  <circle cx="254" cy="520" r="7" fill="#FB8C00" stroke="#FFFFFF" stroke-width="2"/>
  <!-- GPIO 33 -->
  <text x="44" y="696" fill="#F3E5F5" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">GPIO 33</text>
  <text x="130" y="696" fill="#CE93D8" font-family="Arial, Helvetica, sans-serif" font-size="13">BUZZER</text>
  <circle cx="254" cy="692" r="7" fill="#8E24AA" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Power distribution from ESP32 to rails -->
  <path d="M254 120 H990" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M254 120 H990" fill="none" stroke="#E53935" stroke-width="2.5"/>
  <path d="M254 170 H1060" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M254 170 H1060" fill="none" stroke="#263238" stroke-width="2.5"/>

  <!-- HC-SR04 -->
  <rect x="560" y="210" width="360" height="200" rx="14" fill="#FFFFFF" stroke="#1B3A42" stroke-width="1.5"/>
  <rect x="560" y="210" width="360" height="36" rx="14" fill="#E8F4FC"/>
  <rect x="560" y="232" width="360" height="14" fill="#E8F4FC"/>
  <text x="576" y="234" fill="#1565C0" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">HC-SR04</text>
  <text x="670" y="234" fill="#5C7380" font-family="Arial, Helvetica, sans-serif" font-size="12">ultrasonic sensor</text>

  <text x="584" y="294" fill="#1565C0" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">TRIG</text>
  <circle cx="560" cy="290" r="7" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2"/>
  <text x="860" y="294" text-anchor="end" fill="#C62828" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">VCC</text>
  <circle cx="920" cy="290" r="7" fill="#E53935" stroke="#FFFFFF" stroke-width="2"/>

  <text x="584" y="364" fill="#2E7D32" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ECHO</text>
  <circle cx="560" cy="360" r="7" fill="#43A047" stroke="#FFFFFF" stroke-width="2"/>
  <text x="860" y="364" text-anchor="end" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">GND</text>
  <circle cx="920" cy="360" r="7" fill="#263238" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Servo -->
  <rect x="560" y="450" width="360" height="150" rx="14" fill="#FFFFFF" stroke="#1B3A42" stroke-width="1.5"/>
  <rect x="560" y="450" width="360" height="36" rx="14" fill="#FFF4E8"/>
  <rect x="560" y="472" width="360" height="14" fill="#FFF4E8"/>
  <text x="576" y="474" fill="#EF6C00" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Servo</text>
  <text x="640" y="474" fill="#5C7380" font-family="Arial, Helvetica, sans-serif" font-size="12">signal is orange or yellow</text>

  <text x="584" y="524" fill="#EF6C00" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">SIG</text>
  <circle cx="560" cy="520" r="7" fill="#FB8C00" stroke="#FFFFFF" stroke-width="2"/>
  <text x="860" y="524" text-anchor="end" fill="#C62828" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">VCC</text>
  <circle cx="920" cy="520" r="7" fill="#E53935" stroke="#FFFFFF" stroke-width="2"/>

  <text x="860" y="572" text-anchor="end" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">GND</text>
  <circle cx="920" cy="568" r="7" fill="#263238" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Buzzer -->
  <rect x="560" y="630" width="360" height="90" rx="14" fill="#FFFFFF" stroke="#1B3A42" stroke-width="1.5"/>
  <rect x="560" y="630" width="360" height="32" rx="14" fill="#F8EEF8"/>
  <rect x="560" y="648" width="360" height="14" fill="#F8EEF8"/>
  <text x="576" y="652" fill="#6A1B9A" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Buzzer</text>

  <text x="584" y="696" fill="#6A1B9A" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">+</text>
  <circle cx="560" cy="692" r="7" fill="#8E24AA" stroke="#FFFFFF" stroke-width="2"/>
  <text x="860" y="696" text-anchor="end" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">GND</text>
  <circle cx="920" cy="692" r="7" fill="#263238" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Signal wires -->
  <path d="M254 290 H560" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M254 290 H560" fill="none" stroke="#1E88E5" stroke-width="2.5"/>

  <!-- Echo through divider -->
  <path d="M254 360 H330" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M254 360 H330" fill="none" stroke="#43A047" stroke-width="2.5"/>
  <rect x="330" y="348" width="72" height="24" rx="3" fill="#FFFFFF" stroke="#1B3A42" stroke-width="1.5"/>
  <text x="366" y="342" text-anchor="middle" fill="#1B3A42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">1k</text>
  <path d="M402 360 H560" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M402 360 H560" fill="none" stroke="#43A047" stroke-width="2.5"/>
  <circle cx="402" cy="360" r="4" fill="#43A047"/>
  <path d="M402 360 V400" fill="none" stroke="#43A047" stroke-width="2.5"/>
  <rect x="390" y="400" width="24" height="58" rx="3" fill="#FFFFFF" stroke="#1B3A42" stroke-width="1.5"/>
  <text x="428" y="434" fill="#1B3A42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">2k</text>
  <path d="M402 458 V488" fill="none" stroke="#263238" stroke-width="2.5"/>
  <!-- GND symbol -->
  <line x1="384" y1="488" x2="420" y2="488" stroke="#263238" stroke-width="2.5"/>
  <line x1="390" y1="494" x2="414" y2="494" stroke="#263238" stroke-width="2.5"/>
  <line x1="396" y1="500" x2="408" y2="500" stroke="#263238" stroke-width="2.5"/>
  <text x="428" y="492" fill="#263238" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">GND</text>
  <text x="418" y="336" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">5 V to 3.3 V</text>

  <path d="M254 520 H560" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M254 520 H560" fill="none" stroke="#FB8C00" stroke-width="2.5"/>

  <path d="M254 692 H560" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M254 692 H560" fill="none" stroke="#8E24AA" stroke-width="2.5"/>

  <!-- Module power taps to rails -->
  <path d="M920 290 H990" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M920 290 H990" fill="none" stroke="#E53935" stroke-width="2.5"/>
  <path d="M920 360 H1060" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M920 360 H1060" fill="none" stroke="#263238" stroke-width="2.5"/>

  <path d="M920 520 H990" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M920 520 H990" fill="none" stroke="#E53935" stroke-width="2.5"/>
  <path d="M920 568 H1060" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M920 568 H1060" fill="none" stroke="#263238" stroke-width="2.5"/>

  <path d="M920 692 H1060" fill="none" stroke="#FFFFFF" stroke-width="7"/>
  <path d="M920 692 H1060" fill="none" stroke="#263238" stroke-width="2.5"/>

  <!-- Servo supply note -->
  <text x="576" y="584" fill="#8A4B32" font-family="Arial, Helvetica, sans-serif" font-size="11">Prefer a separate 5 V supply for the servo.</text>

  <!-- Legend -->
  <text x="40" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">Wire colours:</text>
  <circle cx="140" cy="738" r="5" fill="#E53935"/>
  <text x="152" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">5V</text>
  <circle cx="190" cy="738" r="5" fill="#263238"/>
  <text x="202" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">GND</text>
  <circle cx="250" cy="738" r="5" fill="#1E88E5"/>
  <text x="262" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">TRIG</text>
  <circle cx="310" cy="738" r="5" fill="#43A047"/>
  <text x="322" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">ECHO</text>
  <circle cx="380" cy="738" r="5" fill="#FB8C00"/>
  <text x="392" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">servo</text>
  <circle cx="450" cy="738" r="5" fill="#8E24AA"/>
  <text x="462" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">buzzer</text>
  <text x="540" y="742" fill="#52666C" font-family="Arial, Helvetica, sans-serif" font-size="12">Join every ground, including a separate servo supply, to ESP32 GND.</text>
</svg>
